<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PomegranatePDF">
  <defs>
    <radialGradient id="pomBody" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="55%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>
    <linearGradient id="pomCrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Crown / Calyx -->
  <path d="M24 16 L21 7 L28 12 L32 5 L36 12 L43 7 L40 16 Z"
        fill="url(#pomCrown)"
        stroke="#7f1d1d"
        stroke-width="1.5"
        stroke-linejoin="round" />

  <!-- Fruit body -->
  <path d="M32 14 C18 14, 10 24, 10 36 C10 50, 20 58, 32 58 C44 58, 54 50, 54 36 C54 24, 46 14, 32 14 Z"
        fill="url(#pomBody)"
        stroke="#7f1d1d"
        stroke-width="1.5" />

  <!-- Subtle leaf -->
  <path d="M37 14 C44 10, 50 11, 52 15 C47 17, 41 17, 37 14 Z"
        fill="#15803d"
        stroke="#14532d"
        stroke-width="1" />

  <!-- Gloss highlight -->
  <ellipse cx="22" cy="28" rx="4.5" ry="9" transform="rotate(-20 22 28)" fill="#ffffff" opacity="0.22" />

  <!-- Pomegranate seeds (arils) window -->
  <path d="M35 30 C42 30, 47 35, 46 42 C45 48, 39 51, 33 49 C30 43, 30 35, 35 30 Z"
        fill="#fef2f2"
        stroke="#991b1b"
        stroke-width="1.2" />
  <circle cx="37" cy="36" r="2.6" fill="#dc2626" />
  <circle cx="42" cy="38" r="2.4" fill="#b91c1c" />
  <circle cx="36" cy="42" r="2.5" fill="#b91c1c" />
  <circle cx="41" cy="44" r="2.5" fill="#dc2626" />
  <circle cx="38" cy="47" r="2" fill="#991b1b" />
</svg>

